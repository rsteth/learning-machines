<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">How many dimensions does a movement need?</title><desc id="desc">Conceptual diagram: two seven-joint arms hold one marked ball. Fourteen joint variables, six rigid relative-pose constraints, eight dimensions locally. Diagram is schematic, not a simulation frame.</desc>
